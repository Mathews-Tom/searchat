[paths]
# Claude projects directory
# Use forward slashes. {username} is replaced with current user.
claude_directory_windows = "~/.claude/projects"
# WSL directory (optional, leave empty if not using WSL)
# Example: //wsl$/Ubuntu/home/{username}/.claude/projects
claude_directory_wsl = ""
# Search index directory
search_directory = "~/.searchat"
auto_detect_environment = true

[indexing]
batch_size = 1000
auto_index = true
index_interval_minutes = 60
max_workers = 4
# Re-index modified conversations to capture in-progress work
reindex_on_modification = true
# Wait 5 minutes after last modification before re-indexing (prevents excessive re-indexing)
modification_debounce_minutes = 5
enable_connectors = true
enable_adaptive_indexing = true

[search]
default_mode = "hybrid"
max_results = 100
snippet_length = 200
temporal_decay_enabled = false
temporal_decay_factor = 0.001
temporal_weight = 1.0

[embedding]
model = "all-MiniLM-L6-v2"
batch_size = 32
cache_embeddings = true
# Device for embedding model:
#   "auto" - auto-detect (cuda > mps > cpu)
#   "cuda" - NVIDIA GPU (Windows/Linux)
#   "mps"  - Apple Silicon GPU (macOS M1/M2/M3)
#   "cpu"  - CPU only
device = "auto"

[ui]
theme = "auto"
font_family = "Segoe UI"
font_size = 11
highlight_color = "#FFEB3B"

[performance]
memory_limit_mb = 3000
query_cache_size = 100
enable_profiling = false
faiss_mmap = false

[analytics]
# Opt-in analytics tracking. When disabled, searches are NOT logged.
enabled = false
retention_days = 30

[logging]
level = "INFO"
file_enabled = true
file_path = "~/.searchat/logs/searchat.log"
file_max_bytes = 10485760  # 10MB
file_backup_count = 5
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
use_rich_console = true

[llm]
default_provider = "ollama"
openai_model = "gpt-4.1-mini"
ollama_model = "ollama/gemma4:latest"

# Embedded (local GGUF via llama-cpp-python). Only used when default_provider = "embedded"
embedded_model_path = ""
embedded_n_ctx = 4096
# 0 = auto
embedded_n_threads = 0
embedded_auto_download = true
embedded_default_preset = "qwen2.5-coder-1.5b-instruct-q4_k_m"

[chat]
# Controls the non-streaming RAG endpoint and citation/source output.
enable_rag = true
enable_citations = true

[export]
# Export feature flags. Keep disabled by default until stabilized.
enable_ipynb = false
enable_pdf = false
enable_tech_docs = false

[dashboards]
# Dashboard builder and widget rendering.
enabled = true

[snapshots]
# Read-only snapshot browsing (backup view).
enabled = true

[daemon]
# Ghost mode daemon (proactive context). Disabled by default.
enabled = false
poll_seconds = 5
rescan_seconds = 30
notifications_enabled = true
# auto|macos|linux
notifications_backend = "auto"
max_suggestions = 3
min_query_length = 8

[compaction]
# searchat compact -- verified copy-compaction of the DuckDB store.
# Auto-triggers on graceful shutdown when file_size / live_data exceeds
# auto_trigger_ratio AND the last compaction was more than
# min_interval_days ago.
auto_trigger_ratio = 3.0
min_interval_days = 7
# Safety bound on the isolated compaction subprocess: terminated (then
# killed) if it runs longer than this, rather than blocking the CLI or
# graceful shutdown forever.
max_duration_seconds = 1800.0

[backup]
# Backup v2 (M4) -- source-of-truth-only backups by default, with a
# retention policy so backups/ doesn't grow unbounded. Pinned backups
# are always exempt from pruning.
# The keep_last most recent non-pinned backups are always kept.
keep_last = 10
# Independently, the newest non-pinned backup in each of the most
# recent keep_monthly distinct calendar months is kept too (a backup
# can satisfy both rules at once; the kept sets are unioned).
keep_monthly = 12
# zstd compression level for plaintext (non-encrypted) backup payloads.
compression_level = 3
# M10 -- scheduled backups. Disabled by default; when enabled, a
# BackupScheduler fires a `create_backup(backup_type="scheduled")` every
# schedule_interval_hours, skipping the run if no source-of-truth data
# changed since the prior backup (any type). Purely additive on top of
# the keep_last/keep_monthly/compression_level retention policy above --
# scheduled backups are pruned by that same policy like any other backup.
schedule_enabled = false
schedule_interval_hours = 24.0

[lifecycle]
# Source conversation-file lifecycle (M8) -- verified archive-then-prune.
# `searchat sources archive|prune` only ever acts on a file that is BOTH
# older than age_threshold_days AND whose connector name is explicitly
# listed in enabled_agents; each action additionally requires both
# verify_ingested (checksum + message-count parity) and verify_roundtrip
# (lossless export re-parse) to pass, enforced in code, not just here.
age_threshold_days = 60
# No connector is prunable until explicitly added, e.g. ["claude", "codex"].
enabled_agents = []
# dry_run reports what WOULD happen without touching disk. NOTE: the
# shipped `sources` CLI does NOT read this value -- its own --dry-run
# flag always defaults to true regardless of what's set here, and only
# an explicit --dry-run=false on the command line can disable it. This
# key exists for completeness and any future non-CLI caller; it cannot
# by itself enable a real mutation from the CLI.
dry_run = true

[dedup]
# Cross-agent duplicate detection (M11) -- report-only. A pair of
# conversations ingested by two DIFFERENT connectors is surfaced as a
# merge/ignore suggestion in the M6 dashboard when their mean
# exchange-embedding cosine similarity meets or exceeds this threshold.
# No code path in this milestone merges or deletes anything -- see
# services/dedup_detection.py.
similarity_threshold = 0.92

[distillation]
# Tiered memory (M9) -- conversations older than age_threshold_days become
# eligible for an LLM-generated distillate via services/distillation_bridge.py;
# once distilled, their verbatim exchanges leave the hot FTS/HNSW index
# (conversations/messages retained, always re-promotable via rehydrate_verbatim).
# palace.enabled below must also be true, and the `palace` extra (faiss-cpu,
# rank-bm25) must be installed -- otherwise the feature stays disabled, not
# a crash. Other distillation.* keys (provider, cli_model, batch_size,
# max_ply_length, min_exchange_chars, prompt, perturn_prompt) default in
# code (config/constants.py) and are not duplicated here.
age_threshold_days = 180

[retention]
# Per-project retention/archival/distillation policy overrides (M12).
# Optional -- omit entirely (the default) to use only the global
# defaults above (lifecycle.age_threshold_days for M8's archive/prune,
# distillation.age_threshold_days for M9's distillation) for every
# project. Define one block per project id to override:
#
# [retention.project."my-project-id"]
# never_touch = true            # exempt from BOTH M8 and M9 entirely
# archive_after_days = 90       # overrides lifecycle.age_threshold_days
# distill_after_days = 365      # overrides distillation.age_threshold_days
#
# Every key is optional; an omitted key falls back to the global
# default for that milestone. A malformed block (unrecognized key,
# non-boolean never_touch, non-integer or negative day count) fails
# CLOSED -- that project is treated as never_touch = true rather than
# silently falling back to the global default.
